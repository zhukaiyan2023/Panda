<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="256" viewBox="0 0 128 256">
  <title>Bamboo Stalk</title>
  <desc>Vertical bamboo stalk with segmented joints and a few leaves.</desc>

  <!-- Main stalk -->
  <rect x="50" y="8" width="28" height="240" rx="14" fill="#6cc28a" stroke="#3d3652" stroke-width="4"/>

  <!-- Segment joints (darker bands) -->
  <rect x="46" y="56" width="36" height="10" rx="4" fill="#3d3652"/>
  <rect x="46" y="124" width="36" height="10" rx="4" fill="#3d3652"/>
  <rect x="46" y="192" width="36" height="10" rx="4" fill="#3d3652"/>

  <!-- Inner highlight on stalk -->
  <rect x="56" y="14" width="5" height="42" rx="2" fill="#fffaf0" opacity="0.55"/>
  <rect x="56" y="72" width="5" height="44" rx="2" fill="#fffaf0" opacity="0.55"/>
  <rect x="56" y="140" width="5" height="44" rx="2" fill="#fffaf0" opacity="0.55"/>
  <rect x="56" y="208" width="5" height="34" rx="2" fill="#fffaf0" opacity="0.55"/>

  <!-- Leaves (a few on each side) -->
  <!-- Top-right leaf cluster -->
  <path d="M 78 40 Q 110 24 122 50 Q 110 64 90 56 Q 80 50 78 40 Z"
        fill="#6cc28a" stroke="#3d3652" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M 86 46 Q 104 42 116 52" fill="none" stroke="#3d3652" stroke-width="2"/>

  <!-- Mid-right leaf -->
  <path d="M 78 110 Q 112 100 120 124 Q 102 132 88 124 Q 80 118 78 110 Z"
        fill="#6cc28a" stroke="#3d3652" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M 86 116 Q 104 116 116 122" fill="none" stroke="#3d3652" stroke-width="2"/>

  <!-- Lower-right leaf -->
  <path d="M 78 180 Q 108 168 118 192 Q 100 202 86 196 Q 80 188 78 180 Z"
        fill="#6cc28a" stroke="#3d3652" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M 86 186 Q 102 188 114 192" fill="none" stroke="#3d3652" stroke-width="2"/>

  <!-- Left side, smaller leaf -->
  <path d="M 50 86 Q 22 78 14 100 Q 30 112 44 104 Q 50 96 50 86 Z"
        fill="#6cc28a" stroke="#3d3652" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M 42 92 Q 28 94 18 100" fill="none" stroke="#3d3652" stroke-width="2"/>

  <path d="M 50 156 Q 22 148 14 172 Q 32 184 46 174 Q 52 166 50 156 Z"
        fill="#6cc28a" stroke="#3d3652" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M 42 164 Q 28 168 18 172" fill="none" stroke="#3d3652" stroke-width="2"/>

  <path d="M 50 220 Q 24 214 16 234 Q 34 244 48 236 Q 52 228 50 220 Z"
        fill="#6cc28a" stroke="#3d3652" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M 42 226 Q 28 230 18 234" fill="none" stroke="#3d3652" stroke-width="2"/>
</svg>
