<?xml version="1.0" encoding="UTF-8"?>
<!--
  Source-of-truth for the mole sprite is mole.png (regenerated 2026-08-13
  via minimax-image for the whack-a-mole grass retheme). This SVG stays
  in the repo as a text-diffable reference of the *original* mole's
  composition (head + tiny body sliver peeking over a horizontal line),
  not as the shipped sprite. k.loadSprite("mole") loads mole.png.

  The grass retheme removed the brown dirt baked into the bottom of the
  prior character — see docs/superpowers/specs/
  2026-08-13-whack-grass-retheme-design.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>Mole (text-diffable reference)</title>
  <desc>See mole.png for the shipped art. The retheme's new mole was
  generated by MiniMax text-to-image, not hand-authored.</desc>
</svg>