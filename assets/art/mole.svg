<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>Happy Mole</title>
  <desc>A cute cartoon mole peeking out of a hole with a big pink nose and buck teeth.</desc>

  <!-- Dirt mound / hole rim (background hill) -->
  <path d="M 0 232 Q 64 200 128 200 Q 192 200 256 232 L 256 256 L 0 256 Z"
        fill="#5a3a1a" stroke="#5a3a1a" stroke-width="4" stroke-linejoin="round"/>

  <!-- Hole (dark opening) -->
  <ellipse cx="128" cy="206" rx="86" ry="26" fill="#3a2410" stroke="#5a3a1a" stroke-width="4"/>

  <!-- Dirt specks on mound -->
  <circle cx="36" cy="240" r="4" fill="#fffaf0" opacity="0.6"/>
  <circle cx="80" cy="248" r="3" fill="#fffaf0" opacity="0.5"/>
  <circle cx="200" cy="244" r="3.5" fill="#fffaf0" opacity="0.5"/>
  <circle cx="232" cy="252" r="3" fill="#fffaf0" opacity="0.5"/>

  <!-- Mole body emerging from hole (just bottom sliver visible) -->
  <path d="M 56 206 Q 70 192 100 188 L 156 188 Q 186 192 200 206 Z"
        fill="#8B5A2B" stroke="#5a3a1a" stroke-width="4" stroke-linejoin="round"/>

  <!-- Tiny rounded ears on top of head -->
  <ellipse cx="78"  cy="78"  rx="14" ry="12" fill="#8B5A2B" stroke="#5a3a1a" stroke-width="4"/>
  <ellipse cx="178" cy="78"  rx="14" ry="12" fill="#8B5A2B" stroke="#5a3a1a" stroke-width="4"/>
  <ellipse cx="78"  cy="80"  rx="6"  ry="5"  fill="#FF8FB3"/>
  <ellipse cx="178" cy="80"  rx="6"  ry="5"  fill="#FF8FB3"/>

  <!-- Head (round) -->
  <circle cx="128" cy="128" r="72" fill="#8B5A2B" stroke="#5a3a1a" stroke-width="4"/>

  <!-- Forehead highlight -->
  <ellipse cx="100" cy="92" rx="26" ry="10" fill="#fffaf0" opacity="0.25"/>

  <!-- Eyes (small black dots) -->
  <circle cx="100" cy="116" r="8" fill="#3d3652"/>
  <circle cx="156" cy="116" r="8" fill="#3d3652"/>
  <!-- Eye sparkles -->
  <circle cx="103" cy="113" r="2.2" fill="#fffaf0"/>
  <circle cx="159" cy="113" r="2.2" fill="#fffaf0"/>

  <!-- Big pink nose -->
  <ellipse cx="128" cy="148" rx="14" ry="11" fill="#FF8FB3" stroke="#5a3a1a" stroke-width="3"/>
  <!-- Nose highlight -->
  <ellipse cx="124" cy="144" rx="3.5" ry="2.5" fill="#fffaf0" opacity="0.7"/>

  <!-- Two large white buck teeth at the bottom -->
  <rect x="116" y="166" width="10" height="20" rx="3" fill="#fffaf0" stroke="#5a3a1a" stroke-width="3"/>
  <rect x="130" y="166" width="10" height="20" rx="3" fill="#fffaf0" stroke="#5a3a1a" stroke-width="3"/>

  <!-- Tiny happy mouth corners (just hint of a smile on each side of teeth) -->
  <path d="M 110 162 Q 116 168 116 172" fill="none" stroke="#5a3a1a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 146 162 Q 140 168 140 172" fill="none" stroke="#5a3a1a" stroke-width="2.5" stroke-linecap="round"/>
</svg>