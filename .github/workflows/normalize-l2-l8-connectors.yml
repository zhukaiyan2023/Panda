name: Normalize L2-L8 connectors

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite connector call sites
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path('Panda/Panda/Levels')

          def replace_function(text: str, signature: str, replacement: str) -> str:
              start = text.find(signature)
              if start < 0:
                  raise RuntimeError(f'missing function: {signature}')
              brace = text.find('{', start)
              if brace < 0:
                  raise RuntimeError(f'missing opening brace: {signature}')
              depth = 0
              in_string = False
              in_line_comment = False
              in_block_comment = False
              escape = False
              i = brace
              while i < len(text):
                  ch = text[i]
                  nxt = text[i + 1] if i + 1 < len(text) else ''
                  if in_line_comment:
                      if ch == '\n':
                          in_line_comment = False
                  elif in_block_comment:
                      if ch == '*' and nxt == '/':
                          in_block_comment = False
                          i += 1
                  elif in_string:
                      if escape:
                          escape = False
                      elif ch == '\\':
                          escape = True
                      elif ch == '"':
                          in_string = False
                  else:
                      if ch == '/' and nxt == '/':
                          in_line_comment = True
                          i += 1
                      elif ch == '/' and nxt == '*':
                          in_block_comment = True
                          i += 1
                      elif ch == '"':
                          in_string = True
                      elif ch == '{':
                          depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0:
                              return text[:start] + replacement + text[i + 1:]
                  i += 1
              raise RuntimeError(f'unbalanced function: {signature}')

          # L2/L3: direct balanced merge connector.
          for level in (2, 3):
              p = root / f'Level{level}View.swift'
              text = p.read_text()
              text = text.replace('L1MergeLines(', 'BalancedMergeConnector(')
              p.write_text(text)

          # L5/L6: direct balanced split/collection connectors.
          for level in (5, 6):
              p = root / f'Level{level}View.swift'
              text = p.read_text()
              text = text.replace('SymmetricVDiagram(', 'BalancedSplitConnector(')
              text = text.replace('PolylineConnectors.Segment', 'BalancedConnectorCollection.Segment')
              text = text.replace('PolylineConnectors(segments:', 'BalancedConnectorCollection(segments:')
              p.write_text(text)

          # L7/L8: one shared split geometry and one shared merge geometry.
          overlay = '''    private func stepArrowsOverlay() -> some View {
        ZStack {
            if let splitArrow = makeSplitArrows() {
                BalancedSplitConnector(
                    source: splitArrow.anchorBottom,
                    destA: splitArrow.splitZeroTop,
                    destB: splitArrow.splitTwoTop,
                    colorA: splitArrow.colorZero,
                    colorB: splitArrow.colorTwo,
                    lineThickness: 7,
                    opacity: 0.85
                )
            }

            let combine = combineArrows()
            if combine.count >= 2 {
                BalancedMergeConnector(
                    anchorTop: combine[0].from,
                    anchorMid: combine[1].from,
                    mergeBox: combine[0].to,
                    colorA: combine[0].color,
                    colorB: combine[1].color,
                    lineThickness: 8
                )
            }
        }
    }'''

          for level in (7, 8):
              p = root / f'Level{level}View.swift'
              text = p.read_text()
              text = replace_function(
                  text,
                  '    private func stepArrowsOverlay() -> some View {',
                  overlay,
              )
              p.write_text(text)

          # L4 is already using BalancedSplitConnector; verify all levels
          # explicitly reference the new shared primitives and that L7/L8
          # no longer call the legacy one-to-one polyline.
          for level in range(2, 9):
              text = (root / f'Level{level}View.swift').read_text()
              if level in (2, 3) and 'BalancedMergeConnector(' not in text:
                  raise RuntimeError(f'L{level}: missing BalancedMergeConnector')
              if level == 4 and 'BalancedSplitConnector(' not in text:
                  raise RuntimeError('L4: missing BalancedSplitConnector')
              if level in (5, 6) and 'BalancedSplitConnector(' not in text:
                  raise RuntimeError(f'L{level}: missing BalancedSplitConnector')
              if level in (7, 8):
                  if 'BalancedSplitConnector(' not in text:
                      raise RuntimeError(f'L{level}: missing BalancedSplitConnector')
                  if 'BalancedMergeConnector(' not in text:
                      raise RuntimeError(f'L{level}: missing BalancedMergeConnector')
                  if 'L3StylePolyline(' in text:
                      raise RuntimeError(f'L{level}: legacy L3StylePolyline call remains')

          print('NORMALIZE-L2-L8: STATIC VALIDATION OK')
          PY

      - name: Commit and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/normalize-l2-l8-connectors.yml
          git add Panda/Panda/Levels/Level2View.swift Panda/Panda/Levels/Level3View.swift Panda/Panda/Levels/Level5View.swift Panda/Panda/Levels/Level6View.swift Panda/Panda/Levels/Level7View.swift Panda/Panda/Levels/Level8View.swift .github/workflows/normalize-l2-l8-connectors.yml
          git commit -m 'auto: normalize L2-L8 connectors'
          git push
