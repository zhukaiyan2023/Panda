name: One-time L5-L8 connector repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'auto: rebuild L5-L8 connectors') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite connector geometry
        shell: python3 {0}
        run: |
          from pathlib import Path
          import re

          root = Path('Panda/Panda')

          # 1) Endpoint geometry: the old helpers subtracted the row's
          # 12pt padding a second time.  MathExpressionWithSlots already
          # reports centers in the padded row coordinate system, so the
          # extra yOff moved every endpoint 12pt upward.
          helper_replacements = {
              'bottom': (
                  'let geoH = size + 24\\n'
                  '        let yOff = size / 2 - geoH / 2\\n'
                  '        return CGPoint(\\n'
                  '            x: frame.minX + centers[slot].x,\\n'
                  '            y: frame.minY + centers[slot].y + yOff + size / 2\\n'
                  '        )',
                  'return CGPoint(\\n'
                  '            x: frame.minX + centers[slot].x,\\n'
                  '            y: frame.minY + centers[slot].y + size / 2\\n'
                  '        )'
              ),
              'top': (
                  'let geoH = size + 24\\n'
                  '        let yOff = size / 2 - geoH / 2\\n'
                  '        return CGPoint(\\n'
                  '            x: frame.minX + centers[slot].x,\\n'
                  '            y: frame.minY + centers[slot].y + yOff - size * halfRatio\\n'
                  '        )',
                  'return CGPoint(\\n'
                  '            x: frame.minX + centers[slot].x,\\n'
                  '            y: frame.minY + centers[slot].y - size * halfRatio\\n'
                  '        )'
              ),
          }

          for level in range(5, 9):
              p = root / 'Levels' / f'Level{level}View.swift'
              text = p.read_text()
              for old, new in helper_replacements.values():
                  text = text.replace(old, new)
              p.write_text(text)

          # 2) L5/L6: explicitly use the new balanced split/merge
          # connectors. Do not rely on typealiases in extensions to
          # shadow the old global connector types.
          for level in (5, 6):
              p = root / 'Levels' / f'Level{level}View.swift'
              text = p.read_text()
              text = text.replace('SymmetricVDiagram(', 'BalancedSplitConnector(')
              text = text.replace('PolylineConnectors.Segment', 'BalancedConnectorCollection.Segment')
              text = text.replace('PolylineConnectors(segments:', 'BalancedConnectorCollection(segments:')
              p.write_text(text)

          # 3) L7/L8: use one shared split connector for the two
          # decomposition branches and one shared merge connector for
          # the two convergence branches. This guarantees true symmetry
          # instead of drawing two unrelated elbows.
          overlay = '''    private func stepArrowsOverlay() -> some View {\n        ZStack {\n            if let splitArrow = makeSplitArrows() {\n                BalancedSplitConnector(\n                    source: splitArrow.anchorBottom,\n                    destA: splitArrow.splitZeroTop,\n                    destB: splitArrow.splitTwoTop,\n                    colorA: splitArrow.colorZero,\n                    colorB: splitArrow.colorTwo,\n                    lineThickness: 7,\n                    opacity: 0.85\n                )\n            }\n\n            let combine = combineArrows()\n            if combine.count >= 2 {\n                let first = combine[0]\n                let second = combine[1]\n                BalancedMergeConnector(\n                    anchorTop: first.from,\n                    anchorMid: second.from,\n                    mergeBox: first.to,\n                    colorA: first.color,\n                    colorB: second.color,\n                    lineThickness: 8\n                )\n            }\n        }\n    }\n'''

          for level in (7, 8):
              p = root / 'Levels' / f'Level{level}View.swift'
              text = p.read_text()
              pattern = r'    private func stepArrowsOverlay\(\) -> some View \{.*?\n    \}\n\n    /// Endpoint bundle'
              replacement = overlay + '    /// Endpoint bundle'
              text, n = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f'Could not replace L{level} stepArrowsOverlay')
              p.write_text(text)

          # 4) Remove artificial connector endpoint insets. The level
          # helpers now return actual edges, so an additional +6/+12pt
          # inset would recreate the visible gaps.
          p = root / 'Components' / 'BalancedMathConnectors.swift'
          text = p.read_text()
          text = text.replace('static let sourceInset: CGFloat = 6', 'static let sourceInset: CGFloat = 0')
          text = text.replace('static let targetInset: CGFloat = 12', 'static let targetInset: CGFloat = 0')
          p.write_text(text)

      - name: Build
        run: |
          xcodebuild \
            -project Panda/Panda.xcodeproj \
            -scheme Panda \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Commit repaired source and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/repair-l5-l8.yml
          git add Panda/Panda/Levels/Level5View.swift Panda/Panda/Levels/Level6View.swift Panda/Panda/Levels/Level7View.swift Panda/Panda/Levels/Level8View.swift Panda/Panda/Components/BalancedMathConnectors.swift .github/workflows/repair-l5-l8.yml
          git commit -m 'auto: rebuild L5-L8 connectors'
          git push
