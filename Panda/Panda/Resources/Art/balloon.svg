<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="240" viewBox="0 0 200 240">
  <title>Red Balloon</title>
  <desc>A round slightly oval red balloon with a knot at the bottom and trailing string. Solid red with no white highlights, so the white digit on the body stays readable.</desc>

  <!-- String (drawn first so it appears behind the balloon near the knot) -->
  <path d="M 100 184 Q 96 200 110 214 Q 124 226 108 238"
        fill="none" stroke="#8B1A1A" stroke-width="2" stroke-linecap="round"/>

  <!-- Knot at bottom (small triangle) -->
  <path d="M 92 168 L 108 168 L 100 184 Z" fill="#8B1A1A" stroke="#8B1A1A" stroke-width="3" stroke-linejoin="round"/>

  <!-- Balloon body (oval, taller than wide) -->
  <ellipse cx="100" cy="92" rx="72" ry="80" fill="#E63946" stroke="#8B1A1A" stroke-width="4"/>

  <!-- Soft side shading on right (darker red, no white) -->
  <path d="M 158 70 Q 172 110 152 150 Q 140 160 138 156 Q 154 120 150 78 Z"
        fill="#8B1A1A" opacity="0.22"/>
</svg>