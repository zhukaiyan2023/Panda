<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>Friendly Padlock</title>
  <desc>A rounded closed padlock in muted gold for locked level cards.</desc>

  <!-- Shackle (back half, behind body) -->
  <path d="M 80 124 L 80 96 Q 80 56 128 56 Q 176 56 176 96 L 176 124"
        fill="none" stroke="#3d3652" stroke-width="18" stroke-linecap="round"/>
  <!-- Shackle inner highlight -->
  <path d="M 80 124 L 80 96 Q 80 56 128 56 Q 176 56 176 96 L 176 124"
        fill="none" stroke="#fffaf0" stroke-width="6" stroke-linecap="round" opacity="0.4"/>

  <!-- Body (rounded square) -->
  <rect x="56" y="116" width="144" height="116" rx="22" ry="22"
        fill="#ffd166" stroke="#3d3652" stroke-width="6"/>

  <!-- Body inner panel -->
  <rect x="72" y="132" width="112" height="84" rx="14" ry="14"
        fill="#fff1dc" stroke="#3d3652" stroke-width="4"/>

  <!-- Keyhole -->
  <circle cx="128" cy="166" r="11" fill="#3d3652"/>
  <rect x="124" y="170" width="8" height="22" rx="2" fill="#3d3652"/>

  <!-- Friendly eyes on the body (gives it personality) -->
  <circle cx="104" cy="148" r="3" fill="#3d3652"/>
  <circle cx="152" cy="148" r="3" fill="#3d3652"/>
  <!-- Tiny smile -->
  <path d="M 116 158 Q 128 165 140 158" fill="none" stroke="#3d3652" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Body highlight -->
  <path d="M 76 130 Q 72 158 80 200" fill="none" stroke="#fffaf0" stroke-width="3" opacity="0.6"/>
</svg>
