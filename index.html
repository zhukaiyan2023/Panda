<!doctype html>
<html lang="en-US">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffd166" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="apple-touch-icon.svg" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <title>Panda's Math Adventure</title>
  <style>
    :root { --ink:#3d3652; --paper:#fffaf0; --pink:#ff8fab; --yellow:#ffd166; --green:#72d6a2; --blue:#7cc7ff; --purple:#9b8cff; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family: "Trebuchet MS", "Arial Rounded MT Bold", system-ui, sans-serif; color:var(--ink); background:linear-gradient(160deg,#dff7ff,#fff1f7 48%,#fff8d9); overflow-x:hidden; }
    button { font:inherit; border:0; cursor:pointer; }
    .cloud { position:fixed; border-radius:999px; background:#fff; opacity:.65; filter:blur(1px); z-index:-1; }
    .cloud.a{width:180px;height:70px;left:4%;top:9%}.cloud.b{width:240px;height:90px;right:5%;top:16%}
    .app { width:min(1050px,94vw); margin:auto; padding:18px 0 34px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
    .brand { display:flex; align-items:center; gap:12px; font-weight:900; font-size:clamp(22px,4vw,34px); }
    .panda-face { width:72px;height:72px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 8px 20px #6b5c8b22; position:relative; overflow:hidden; }
    .panda-face .ear { position:absolute; width:22px;height:22px;background:#3d3652;border-radius:50%; top:4px; }
    .panda-face .ear.l{left:6px} .panda-face .ear.r{right:6px}
    .panda-face .eye { position:absolute; width:14px;height:14px;background:#3d3652;border-radius:50%; top:30px; }
    .panda-face .eye.l{left:14px} .panda-face .eye.r{right:14px}
    .panda-face .cheek { position:absolute; width:14px;height:8px;background:#ffb6c1;border-radius:50%; top:42px; }
    .panda-face .cheek.l{left:6px} .panda-face .cheek.r{right:6px}
    .panda-face .mouth { position:absolute; width:12px;height:6px;border:3px solid #3d3652;border-top:0;border-radius:0 0 12px 12px; bottom:14px; left:50%; transform:translateX(-50%); background:transparent; }
    .panda-face .nose { position:absolute; width:8px;height:6px;background:#3d3652;border-radius:50%; top:36px; left:50%; transform:translateX(-50%); }
    .header-right { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .pill { background:#fff;padding:10px 16px;border-radius:999px;font-weight:800;box-shadow:0 6px 16px #6b5c8b18; display:inline-flex; align-items:center; gap:6px; }
    .pill.clickable { cursor:pointer; transition:.15s; }
    .pill.clickable:hover { transform:translateY(-2px); box-shadow:0 8px 18px #6b5c8b25; }
    .pill.clickable[aria-pressed="true"] { background:var(--yellow); }
    .stickers { display:flex; gap:4px; padding:6px 10px; }
    .stickers .sticker { font-size:18px; opacity:.25; transition:.25s; }
    .stickers .sticker.unlocked { opacity:1; transform:scale(1.15); }
    main { margin-top:18px; background:rgba(255,255,255,.78); border:4px solid #fff; border-radius:34px; box-shadow:0 20px 60px #68587b22; padding:clamp(18px,4vw,38px); }
    .scene { text-align:center; }
    .speech { display:inline-block; max-width:760px; background:#fff; border-radius:28px; padding:16px 24px; font-size:clamp(20px,4vw,31px); font-weight:900; box-shadow:0 7px 18px #68587b18; }
    .speak { margin-left:8px; width:46px;height:46px;border-radius:50%;background:var(--yellow);font-size:22px;vertical-align:middle; }
    .speak.cn { background:var(--pink); color:#fff; }
    .problem { margin:22px auto 8px; font-size:clamp(44px,10vw,86px); font-weight:1000; letter-spacing:3px; }
    .objects { min-height:135px; display:flex; justify-content:center; align-items:center; flex-wrap:wrap; gap:8px; max-width:720px; margin:auto; }
    .obj { width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:#fff;box-shadow:0 5px 12px #6b5c8b18; animation:pop .35s ease both; }
    @keyframes pop { from{transform:scale(.5);opacity:0} to{transform:scale(1);opacity:1} }
    .choice-label { font-size:20px;font-weight:900;margin:14px 0 10px; }
    .choices { display:flex;justify-content:center;gap:12px;flex-wrap:wrap; }
    .choice { min-width:88px;min-height:76px;padding:12px 22px;border-radius:24px;background:#fff;box-shadow:0 8px 18px #68587b20;font-size:34px;font-weight:1000;transition:.15s; }
    .choice:hover { transform:translateY(-3px) rotate(-1deg); }
    .choice:active { transform:scale(.95); }
    .choice:focus-visible { outline:4px solid var(--purple); outline-offset:3px; }
    .choice.disabled { background:#e6e1ef; color:#aaa3bd; box-shadow:none; cursor:not-allowed; pointer-events:none; opacity:.6; }
    .voice-fallback { display:none; margin-top:10px; padding:10px 14px; background:#fff3a8; border-radius:14px; font-size:16px; font-weight:800; color:#5a4400; }
    .voice-fallback.show { display:inline-block; }
    .hint { min-height:30px;margin-top:16px;font-size:19px;font-weight:800; }
    .progress { height:14px;background:#eee6f4;border-radius:999px;overflow:hidden;margin:22px 0 10px; }
    .bar { height:100%;width:25%;max-width:100%;background:linear-gradient(90deg,var(--pink),var(--purple),var(--blue));border-radius:999px;transition:.4s; }
    .steps { display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:14px; }
    .step { padding:8px 13px;border-radius:999px;background:#f0ecfa;font-weight:900;font-size:14px; }
    .step.active { background:var(--yellow); }
    .celebrate { font-size:clamp(26px,5vw,46px);font-weight:1000;margin:10px; }
    .celebrate.big { animation:celebrate .9s ease both; }
    @keyframes celebrate {
      0%{transform:scale(.6) rotate(-6deg);opacity:0}
      60%{transform:scale(1.15) rotate(4deg);opacity:1}
      100%{transform:scale(1) rotate(0);opacity:1}
    }
    .next { margin-top:18px;background:var(--green);padding:15px 30px;border-radius:22px;font-size:24px;font-weight:1000;box-shadow:0 8px 0 #43ae7a; }
    .next:active { transform:translateY(4px);box-shadow:0 4px 0 #43ae7a; }
    .tiny { margin-top:14px;font-size:14px;opacity:.7; }

    /* Level picker overlay */
    .level-screen { display:flex; flex-direction:column; align-items:center; gap:18px; padding:14px; }
    .level-screen h2 { margin:0; font-size:clamp(24px,4vw,36px); }
    .level-card { display:flex; align-items:center; gap:16px; background:#fff; border-radius:24px; padding:14px 18px; box-shadow:0 8px 18px #68587b18; width:min(640px, 92%); text-align:left; cursor:pointer; transition:.15s; border:3px solid transparent; }
    .level-card:hover { transform:translateY(-2px); box-shadow:0 12px 22px #68587b28; }
    .level-card:focus-visible { outline:4px solid var(--purple); outline-offset:3px; }
    .level-card.locked { opacity:.55; cursor:not-allowed; }
    .level-card.locked:hover { transform:none; }
    .level-card.current { border-color:var(--yellow); }
    .level-card .badge { font-size:36px; flex:0 0 auto; }
    .level-card .meta { flex:1; }
    .level-card .meta strong { display:block; font-size:18px; }
    .level-card .meta span { font-size:14px; opacity:.75; }
    .level-card .status { font-size:14px; font-weight:900; padding:6px 12px; border-radius:999px; background:#f0ecfa; }
    .level-card .status.unlocked { background:var(--green); color:#fff; }
    .level-card .status.next { background:var(--yellow); }

    /* Confetti */
    .confetti-host { position:fixed; inset:0; pointer-events:none; overflow:hidden; }
    .confetti { position:absolute; width:14px; height:14px; top:-20px; opacity:.9; animation:fall linear forwards; }
    @keyframes fall {
      to { transform:translateY(110vh) rotate(720deg); opacity:0; }
    }
    .sticker-pop { position:fixed; pointer-events:none; font-size:96px; left:50%; top:50%; transform:translate(-50%,-50%) scale(0); animation:popSticker 1.4s ease both; z-index:50; }
    @keyframes popSticker {
      0%{transform:translate(-50%,-50%) scale(0);opacity:0}
      40%{transform:translate(-50%,-50%) scale(1.4);opacity:1}
      70%{transform:translate(-50%,-50%) scale(1);opacity:1}
      100%{transform:translate(-50%,-50%) scale(.6);opacity:0}
    }
    @media(max-width:600px){ .panda-face{width:58px;height:58px} .panda-face .ear{width:18px;height:18px} .panda-face .eye{width:11px;height:11px;top:24px} .panda-face .nose{width:6px;height:5px;top:28px} .panda-face .cheek{width:10px;height:6px;top:34px} .pill{padding:8px 12px} .obj{width:42px;height:42px;font-size:23px} main{border-radius:26px} }
  </style>
</head>
<body>
  <div class="cloud a"></div><div class="cloud b"></div>
  <div class="confetti-host" id="confettiHost" aria-hidden="true"></div>
  <div class="app">
    <header>
      <div class="brand">
        <div class="panda-face" aria-hidden="true"><div class="ear l"></div><div class="ear r"></div><div class="eye l"></div><div class="eye r"></div><div class="cheek l"></div><div class="cheek r"></div><div class="nose"></div><div class="mouth"></div></div>
        <span>Panda's Math Adventure</span>
      </div>
      <div class="header-right">
        <button class="pill clickable" id="levelBtn" aria-pressed="false" aria-label="Choose level">🎯 <span id="levelLabel">Level 1</span></button>
        <div class="pill">⭐ <span id="stars">0</span></div>
        <div class="pill stickers" id="stickers" aria-label="Sticker collection">
          <span class="sticker" data-sticker="apple">🍎</span>
          <span class="sticker" data-sticker="star">⭐</span>
          <span class="sticker" data-sticker="cake">🎂</span>
          <span class="sticker" data-sticker="balloon">🎈</span>
          <span class="sticker" data-sticker="strawberry">🍓</span>
          <span class="sticker" data-sticker="rainbow">🌈</span>
        </div>
      </div>
    </header>
    <main>
      <div id="root"></div>
    </main>
  </div>
<script>
(function(){
  'use strict';

  // ----- Bao Bao (panda teacher) character profile -----
  const BAO_BAO = {
    name: 'Bao Bao',
    face: 'panda',
    palette: { body:'#ffffff', ear:'#3d3652', cheek:'#ffb6c1' },
    catchphrase: "Let's make a ten together!",
    encouragement: {
      correct: [
        { en: "Wonderful! You're a math star!", zh: '太棒了！你是数学小明星！' },
        { en: 'Yes! You got it. Keep going!', zh: '答对啦！继续加油！' },
        { en: 'Amazing work, friend!', zh: '真厉害！小朋友！' },
        { en: 'You make Panda so proud!', zh: '熊猫老师为你骄傲！' }
      ],
      wrong: [
        { en: "That's okay. Let's try once more.", zh: '没关系，再试一次。' },
        { en: 'Almost! Take another look.', zh: '差一点点，再看看。' }
      ],
      roundEnd: [
        { en: "You finished this one. Fantastic!", zh: '这一关完成啦！真棒！' },
        { en: "Level cleared! You're amazing.", zh: '过关啦！你真厉害。' }
      ],
      levelComplete: [
        { en: "🎉 You unlocked a new level! Tap to keep going.", zh: '🎉 解锁新关卡啦！点一下继续。' },
        { en: '🌟 All clear! Pick the next adventure.', zh: '🌟 关卡全通！去选下一关吧。' }
      ],
      allDone: [
        { en: '🏆 You finished every level! You are a true math champion!', zh: '🏆 所有关卡都通关啦！你是真正的数学冠军！' }
      ]
    }
  };

  // ----- Levels -----
  // Each level: 6 problems, with a target max sum. Stickers awarded on completion.
  const LEVELS = [
    {
      id: 'l1',
      title: 'Level 1 · Tiny Numbers',
      maxSum: 5,
      description: 'Numbers up to 5. Just getting started!',
      sticker: 'apple',
      rounds: [
        {a:1, b:1, emoji:'🍎'}, {a:2, b:2, emoji:'🍎'}, {a:1, b:3, emoji:'🍎'},
        {a:4, b:1, emoji:'🍎'}, {a:2, b:3, emoji:'🍎'}, {a:3, b:2, emoji:'🍎'}
      ]
    },
    {
      id: 'l2',
      title: 'Level 2 · Make a Ten',
      maxSum: 10,
      description: 'Make ten! Learn the friend strategy.',
      sticker: 'star',
      rounds: [
        {a:8, b:5, emoji:'⭐'}, {a:7, b:6, emoji:'⭐'}, {a:9, b:4, emoji:'⭐'},
        {a:6, b:7, emoji:'⭐'}, {a:8, b:6, emoji:'⭐'}, {a:9, b:7, emoji:'⭐'}
      ]
    },
    {
      id: 'l3',
      title: 'Level 3 · Bigger Numbers',
      maxSum: 20,
      description: 'Up to 20 — keep stacking!',
      sticker: 'rainbow',
      rounds: [
        {a:9, b:8, emoji:'🌈'}, {a:8, b:9, emoji:'🌈'}, {a:7, b:9, emoji:'🌈'},
        {a:9, b:9, emoji:'🌈'}, {a:8, b:8, emoji:'🌈'}, {a:7, b:8, emoji:'🌈'}
      ]
    }
  ];

  const TOTAL_LEVELS = LEVELS.length;

  // ----- Persistence -----
  const STORAGE_KEY = 'panda-progress-v1';
  function loadProgress(){
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return defaultProgress();
      const p = JSON.parse(raw);
      return {
        currentLevel: clampInt(p.currentLevel, 0, TOTAL_LEVELS-1, 0),
        starsByLevel: Array.isArray(p.starsByLevel) && p.starsByLevel.length === TOTAL_LEVELS
          ? p.starsByLevel.map(n => clampInt(n, 0, 6, 0))
          : [0,0,0],
        unlockedStickers: Array.isArray(p.unlockedStickers) ? p.unlockedStickers.slice(0, 6) : [],
        totalStars: clampInt(p.totalStars, 0, 999, 0)
      };
    } catch(_){ return defaultProgress(); }
  }
  function defaultProgress(){
    return { currentLevel:0, starsByLevel:[0,0,0], unlockedStickers:[], totalStars:0 };
  }
  function clampInt(n, lo, hi, fallback){
    const v = parseInt(n, 10);
    if(Number.isNaN(v)) return fallback;
    return Math.max(lo, Math.min(hi, v));
  }
  function saveProgress(p){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); } catch(_){}
  }
  let progress = loadProgress();

  // ----- Audio abstraction (EN + CN) -----
  const audio = (() => {
    const supported = ('speechSynthesis' in window) && ('SpeechSynthesisUtterance' in window);
    let enVoice = null;
    let cnVoice = null;
    let cancelTimer = null;
    let cnTimer = null;

    function pickVoices(){
      if(!supported) return;
      const voices = speechSynthesis.getVoices();
      if(!voices || !voices.length) return;
      enVoice = voices.find(v => /^en[-_]US/i.test(v.lang)) || null;
      cnVoice = voices.find(v => /^zh/i.test(v.lang)) || null;
    }
    if(supported){
      pickVoices();
      speechSynthesis.addEventListener('voiceschanged', pickVoices);
    }

    function isSupported(){ return supported; }
    function hasCN(){ return !!cnVoice; }

    function speakNow(text, lang, voice, rate){
      if(!supported || !text) return false;
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang;
      u.rate = rate;
      u.pitch = 1.1;
      if(voice){ try{ u.voice = voice; }catch(_){ } }
      try{ speechSynthesis.speak(u); }catch(_){}
      return true;
    }

    function say(text){
      if(!supported || !text) return false;
      if(cancelTimer) clearTimeout(cancelTimer);
      if(cnTimer) clearTimeout(cnTimer);
      cnTimer = null;
      cancelTimer = setTimeout(() => {
        try{ speechSynthesis.cancel(); }catch(_){}
        speakNow(text, 'en-US', enVoice, 0.86);
        cancelTimer = null;
      }, 200);
      return true;
    }

    // EN followed by a brief Chinese recap ~0.5s later.
    function sayBilingual(enText, zhText){
      if(!supported || !enText) return false;
      if(cancelTimer) clearTimeout(cancelTimer);
      if(cnTimer) clearTimeout(cnTimer);
      cancelTimer = setTimeout(() => {
        try{ speechSynthesis.cancel(); }catch(_){}
        speakNow(enText, 'en-US', enVoice, 0.86);
        cancelTimer = null;
        if(zhText){
          cnTimer = setTimeout(() => {
            speakNow(zhText, 'zh-CN', cnVoice, 0.95);
            cnTimer = null;
          }, 500);
        }
      }, 200);
      return true;
    }

    function repeatCN(zhText){
      if(!supported || !zhText || !cnVoice) return false;
      if(cnTimer) clearTimeout(cnTimer);
      cnTimer = setTimeout(() => {
        try{ speechSynthesis.cancel(); }catch(_){}
        speakNow(zhText, 'zh-CN', cnVoice, 0.95);
        cnTimer = null;
      }, 200);
      return true;
    }

    function cancel(){
      if(cancelTimer){ clearTimeout(cancelTimer); cancelTimer = null; }
      if(cnTimer){ clearTimeout(cnTimer); cnTimer = null; }
      if(supported){ try{ speechSynthesis.cancel(); }catch(_){ } }
    }

    return { say, sayBilingual, repeatCN, cancel, isSupported, hasCN };
  })();

  window.audio = audio;

  // ----- DOM helpers -----
  const $ = id => document.getElementById(id);
  const root = $('root');

  function showVoiceFallback(){
    const fb = document.querySelector('.voice-fallback');
    if(fb) fb.classList.add('show');
  }

  if(!audio.isSupported()){
    showVoiceFallback();
  }

  // ----- Sticker UI -----
  function renderStickers(){
    document.querySelectorAll('#stickers .sticker').forEach(el => {
      const s = el.dataset.sticker;
      el.classList.toggle('unlocked', progress.unlockedStickers.includes(s));
    });
  }
  function setStars(n){ $('stars').textContent = String(n); }
  function setLevelLabel(idx){ $('levelLabel').textContent = `Level ${idx+1}`; }

  // ----- Celebration visuals -----
  function confetti(count){
    const host = $('confettiHost');
    if(!host) return;
    const colors = ['#ff8fab','#ffd166','#72d6a2','#7cc7ff','#9b8cff'];
    for(let i=0;i<count;i++){
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = (Math.random()*100) + 'vw';
      c.style.background = colors[i % colors.length];
      c.style.animationDuration = (1.5 + Math.random()*1.5) + 's';
      c.style.animationDelay = (Math.random()*0.3) + 's';
      c.style.transform = `rotate(${Math.random()*360}deg)`;
      c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      host.appendChild(c);
      setTimeout(() => c.remove(), 3500);
    }
  }
  function popSticker(emoji){
    const el = document.createElement('div');
    el.className = 'sticker-pop';
    el.textContent = emoji;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1500);
  }
  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  // ----- Game state machine -----
  let roundInLevel = 0;     // 0..5 within current level
  let state = 'need';
  let level = LEVELS[progress.currentLevel];
  let promptText = '';
  let lastChoicesCtx = null;

  function currentRound(){ return level.rounds[roundInLevel % level.rounds.length]; }

  function setStep(n){
    for(let i=1;i<=4;i++){
      const el = document.getElementById('s'+i);
      if(!el) continue;
      el.classList.toggle('active', i===n);
      if(i===n) el.setAttribute('aria-current','step');
      else el.removeAttribute('aria-current');
    }
    const bar = document.getElementById('bar');
    if(bar) bar.style.width = (n===4 ? 100 : n*25)+'%';
  }

  function renderObjects(count, emoji){
    const host = document.getElementById('objects');
    if(!host) return;
    host.innerHTML='';
    for(let i=0;i<count;i++){
      const d=document.createElement('div');
      d.className='obj';
      d.textContent=emoji;
      d.style.animationDelay=(i*.035)+'s';
      host.appendChild(d);
    }
  }

  // ----- Choices with retry + keyboard support -----
  function choices(ctx){
    const { values, correct, onCorrect, hint } = ctx;
    const host = document.getElementById('choices');
    host.innerHTML='';
    values.forEach((v, idx) => {
      const b = document.createElement('button');
      b.className = 'choice';
      b.type = 'button';
      b.tabIndex = 0;
      const display = String(v);
      b.setAttribute('aria-label', `Choice ${idx+1}: ${display}`);
      b.dataset.value = String(v);
      b.dataset.idx = String(idx);
      b.textContent = display;
      b.addEventListener('click', () => handleChoice(idx));
      host.appendChild(b);
    });
    lastChoicesCtx = { ctx, wrong: new Set() };
    focusChoice(0);
  }

  function focusChoice(idx){
    const btns = document.querySelectorAll('.choice');
    if(!btns.length) return;
    const i = Math.max(0, Math.min(btns.length-1, idx));
    btns[i].focus();
  }

  function handleChoice(idx){
    if(!lastChoicesCtx) return;
    const { ctx, wrong } = lastChoicesCtx;
    const btns = document.querySelectorAll('.choice');
    const btn = btns[idx];
    if(!btn || btn.classList.contains('disabled')) return;
    const v = ctx.values[idx];
    if(String(v) === String(ctx.correct)){
      ctx.onCorrect();
    } else {
      btn.classList.add('disabled');
      btn.setAttribute('aria-disabled','true');
      wrong.add(idx);
      const w = pick(BAO_BAO.encouragement.wrong);
      const hintEl = document.getElementById('hint');
      if(hintEl) hintEl.textContent = '💡 ' + ctx.hint;
      audio.sayBilingual('Try again! ' + ctx.hint, w.zh);
    }
  }

  // ----- Game render -----
  function renderGame(){
    const lvl = LEVELS[progress.currentLevel];
    level = lvl;
    const roundNum = roundInLevel + 1;
    const total = lvl.rounds.length;
    root.innerHTML = `
      <div class="scene">
        <div class="speech">
          <span id="message"></span>
          <button class="speak" id="speak" aria-label="Hear instruction">🔊</button>
          <button class="speak cn" id="speakCN" aria-label="Hear Chinese recap">中</button>
        </div>
        <div class="voice-fallback">🔇 Your device can't speak yet. Tap the 🔊 button to read the lesson.</div>
        <div class="problem" id="problem"></div>
        <div class="objects" id="objects"></div>
        <div class="choice-label" id="choiceLabel"></div>
        <div class="choices" id="choices"></div>
        <div class="hint" id="hint"></div>
        <div class="progress"><div class="bar" id="bar"></div></div>
        <div class="steps"><span class="step" id="s1">Find a friend</span><span class="step" id="s2">Make 10</span><span class="step" id="s3">Add the rest</span><span class="step" id="s4">Celebrate</span></div>
        <div class="tiny">Round ${roundNum} / ${total} · ${lvl.title}</div>
        <div id="finish"></div>
      </div>
    `;
    if(!audio.isSupported()){
      const fb = root.querySelector('.voice-fallback');
      if(fb) fb.classList.add('show');
    }
    start();
  }

  function start(){
    state='need';
    const {a,b,emoji}=currentRound();
    $('problem').textContent = `${a} + ${b} = ?`;
    $('message').textContent = `Bao Bao needs your help! Let's make a ten.`;
    $('choiceLabel').textContent = `How many does ${a} need to make 10?`;
    $('hint').textContent='';
    $('finish').innerHTML='';
    setStep(1);
    renderObjects(a, emoji);
    choices({
      values:[1,2,3,4],
      correct: 10-a,
      hint: `Pick the number that, with ${a}, makes 10.`,
      onCorrect: split
    });
    promptText = `Bao Bao needs your help. Let's make a ten. How many does ${a} need to make 10?`;
    bindSpeakButtons(promptText);
    audio.say(promptText);
  }

  function split(){
    state='split';
    const {a,b,emoji}=currentRound();
    const need=10-a, rest=b-need;
    setStep(2);
    $('message').textContent = `Great! We need ${need}. Let's take ${need} from ${b}.`;
    $('choiceLabel').textContent = `Which way should we split ${b}?`;
    choices({
      values:[[need,rest],[rest,need],[a,b]].map(x=>`${x[0]} and ${x[1]}`),
      correct: `${need} and ${rest}`,
      hint: `Split ${b} into ${need} and ${rest}.`,
      onCorrect: makeTen
    });
    renderObjects(b, emoji);
    promptText = `Great! We need ${need}. Let's take ${need} from ${b}. Which way should we split ${b}?`;
    bindSpeakButtons(promptText);
    audio.say(promptText);
  }

  function makeTen(){
    state='ten';
    const {a,b,emoji}=currentRound();
    const need=10-a, rest=b-need;
    setStep(3);
    $('message').textContent = `Awesome! ${a} plus ${need} makes 10!`;
    $('choiceLabel').textContent = `Now choose what comes next.`;
    $('hint').textContent = `${a} + ${need} = 10`;
    renderObjects(10, emoji);
    choices({
      values:[rest,10,need],
      correct: rest,
      hint: `We made 10. Now add the leftover.`,
      onCorrect: finishRound
    });
    promptText = `Awesome! ${a} plus ${need} makes ten. Now we have ${rest} left over. What number comes next?`;
    bindSpeakButtons(promptText);
    audio.say(promptText);
  }

  function finishRound(){
    const {a,b}=currentRound();
    const need=10-a, rest=b-need, total=a+b;
    setStep(4);
    progress.starsByLevel[progress.currentLevel] = (progress.starsByLevel[progress.currentLevel] || 0) + 1;
    progress.totalStars = (progress.totalStars || 0) + 1;
    saveProgress(progress);
    setStars(progress.totalStars);

    const c = pick(BAO_BAO.encouragement.correct);
    $('message').textContent = `You did it! ${total} is the answer!`;
    $('choiceLabel').textContent='';
    $('hint').textContent = `${a} + ${b} → ${a} + ${need} + ${rest} → 10 + ${rest} → ${total}`;
    renderObjects(total, '⭐');
    $('choices').innerHTML='';
    lastChoicesCtx = null;

    roundInLevel++;
    const finishedLevel = roundInLevel >= level.rounds.length;
    const celebrationEmoji = finishedLevel ? '🏆' : '🎉';

    if(finishedLevel){
      const sticker = level.sticker;
      if(sticker && !progress.unlockedStickers.includes(sticker)){
        progress.unlockedStickers.push(sticker);
        saveProgress(progress);
        renderStickers();
        popSticker(stickerEmoji(sticker));
      }
      // promote current level pointer if more remain
      if(progress.currentLevel < TOTAL_LEVELS - 1){
        progress.currentLevel += 1;
        saveProgress(progress);
      }
      setLevelLabel(progress.currentLevel);
      const finishEl = $('finish');
      finishEl.innerHTML = `
        <div class="celebrate big">${celebrationEmoji} Level complete! ${celebrationEmoji}</div>
        <div class="tiny">Sticker earned: ${stickerEmoji(sticker)}</div>
        <button class="next" id="nextBtn">Choose Level ➜</button>
      `;
      confetti(60);
      const lvlMsg = pick(BAO_BAO.encouragement.levelComplete);
      const allDone = progress.unlockedStickers.length >= TOTAL_LEVELS;
      if(allDone){
        const all = pick(BAO_BAO.encouragement.allDone);
        audio.sayBilingual(all.en, all.zh);
      } else {
        audio.sayBilingual(`${BAO_BAO.name} says: ${lvlMsg.en}`, lvlMsg.zh);
      }
      promptText = `${BAO_BAO.name}: ${lvlMsg.en}`;
      bindSpeakButtons(promptText);
      const nextBtn = $('nextBtn');
      if(nextBtn) nextBtn.onclick = () => { renderLevelPicker(); };
    } else {
      $('finish').innerHTML = `<div class="celebrate">🎉 Amazing! 🎉</div><button class="next" id="nextBtn">Next ➜</button>`;
      confetti(20);
      audio.sayBilingual(c.en, c.zh);
      promptText = `You did it! ${a} plus ${b} equals ${total}. ${c.en}`;
      bindSpeakButtons(promptText);
      const nextBtn = $('nextBtn');
      if(nextBtn) nextBtn.onclick = () => { renderGame(); };
    }
  }

  function stickerEmoji(key){
    const m = { apple:'🍎', star:'⭐', cake:'🎂', balloon:'🎈', strawberry:'🍓', rainbow:'🌈' };
    return m[key] || '🎁';
  }

  function bindSpeakButtons(enText){
    const sp = document.getElementById('speak');
    const spCN = document.getElementById('speakCN');
    if(sp) sp.onclick = () => { if(audio.isSupported()) audio.say(enText); else showVoiceFallback(); };
    if(spCN) spCN.onclick = () => {
      if(!audio.isSupported()){ showVoiceFallback(); return; }
      // Repeat last Chinese line — use a synthesized CN recap if available.
      const zh = synthZhForPrompt(enText);
      if(audio.hasCN()){
        audio.repeatCN(zh);
      } else {
        // visual fallback: show Chinese caption
        const cap = document.createElement('div');
        cap.className = 'tiny';
        cap.textContent = '中文：' + zh;
        cap.style.fontSize = '16px';
        cap.style.fontWeight = '800';
        cap.style.marginTop = '8px';
        const finish = document.getElementById('finish');
        (finish || root).appendChild(cap);
        setTimeout(() => cap.remove(), 4000);
      }
    };
  }

  // Map common EN prompts to a brief CN recap. Falls back to a generic.
  function synthZhForPrompt(en){
    if(/Bao Bao needs your help/i.test(en)) return '熊猫老师需要你的帮助，我们来凑十。';
    if(/take \d+ from \d+/i.test(en)) return '我们从第二个数里拿出补数。';
    if(/makes ten/i.test(en)) return '加一加，凑成十啦！';
    if(/finished this one/i.test(en)) return '这一关完成啦！';
    if(/finished every level/i.test(en)) return '所有关卡都通关啦！';
    if(/unlocked a new level/i.test(en)) return '解锁新关卡啦！';
    if(/You did it/i.test(en)) return '答对啦！你真棒！';
    return '继续加油。';
  }

  // ----- Level picker -----
  function renderLevelPicker(){
    setLevelLabel(progress.currentLevel);
    audio.cancel();
    const cards = LEVELS.map((lvl, i) => {
      const stars = progress.starsByLevel[i] || 0;
      const unlocked = i === 0 || stars > 0 || progress.unlockedStickers.includes(lvl.sticker);
      const isCurrent = i === progress.currentLevel;
      const status = unlocked
        ? (stars >= lvl.rounds.length ? `<span class="status unlocked">⭐ ${stars}/${lvl.rounds.length}</span>` : (isCurrent ? '<span class="status next">Play</span>' : '<span class="status">Open</span>'))
        : '<span class="status">Locked</span>';
      const cls = `level-card ${unlocked ? '' : 'locked'} ${isCurrent ? 'current' : ''}`;
      return `
        <div class="${cls}" role="button" tabindex="${unlocked ? 0 : -1}" data-level="${i}" aria-label="${lvl.title}">
          <div class="badge">${stickerEmoji(lvl.sticker)}</div>
          <div class="meta">
            <strong>${lvl.title}</strong>
            <span>${lvl.description}</span>
          </div>
          ${status}
        </div>
      `;
    }).join('');
    root.innerHTML = `
      <div class="level-screen">
        <h2>${BAO_BAO.name}'s Math Adventure</h2>
        <p class="tiny">Pick a level to play. ${BAO_BAO.catchphrase}</p>
        ${cards}
        <p class="tiny">Stickers: ${progress.unlockedStickers.length}/${TOTAL_LEVELS}</p>
      </div>
    `;
    root.querySelectorAll('.level-card').forEach(card => {
      const i = parseInt(card.dataset.level, 10);
      const stars = progress.starsByLevel[i] || 0;
      const unlocked = i === 0 || stars > 0 || progress.unlockedStickers.includes(LEVELS[i].sticker);
      if(!unlocked) return;
      card.addEventListener('click', () => startLevel(i));
      card.addEventListener('keydown', e => {
        if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); startLevel(i); }
      });
    });
  }

  function startLevel(i){
    progress.currentLevel = i;
    roundInLevel = 0;
    saveProgress(progress);
    setLevelLabel(i);
    $('levelBtn').setAttribute('aria-pressed', 'false');
    renderGame();
  }

  // ----- Global keyboard handler -----
  document.addEventListener('keydown', e => {
    const btns = document.querySelectorAll('.choice');
    if(!btns.length) return;
    const active = document.activeElement;
    const idx = active && active.classList && active.classList.contains('choice')
      ? Number(active.dataset.idx)
      : 0;

    if(e.key >= '1' && e.key <= '9'){
      const n = parseInt(e.key,10) - 1;
      if(n < btns.length){ e.preventDefault(); focusChoice(n); handleChoice(n); }
      return;
    }
    if(e.key === 'ArrowRight' || e.key === 'ArrowDown'){
      e.preventDefault();
      focusChoice((idx+1) % btns.length);
    } else if(e.key === 'ArrowLeft' || e.key === 'ArrowUp'){
      e.preventDefault();
      focusChoice((idx-1+btns.length) % btns.length);
    } else if(e.key === 'Enter' || e.key === ' '){
      if(active && active.classList && active.classList.contains('choice')){
        e.preventDefault();
        handleChoice(idx);
      }
    }
  });

  // ----- Header level button -----
  $('levelBtn').addEventListener('click', () => {
    const pressed = $('levelBtn').getAttribute('aria-pressed') === 'true';
    $('levelBtn').setAttribute('aria-pressed', pressed ? 'false' : 'true');
    if(pressed){
      renderGame();
    } else {
      renderLevelPicker();
    }
  });

  // ----- Service worker registration -----
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(()=>{/* offline just won't cache */});
    });
  }

  // ----- Boot -----
  setStars(progress.totalStars);
  setLevelLabel(progress.currentLevel);
  renderStickers();
  renderGame();
})();
</script>
</body>
</html>
